---
- name: Создание тома для WordPress
  community.docker.docker_volume:
    name: wordpress_data
    state: present

- name: Запуск контейнера WordPress
  community.docker.docker_container:
    name: wordpress
    image: wordpress:php8.3-apache
    state: started
    restart_policy: unless-stopped
    networks:
      - name: wordpress_network
    published_ports:
      - "{{ wordpress_port }}:80"
    env:
      WORDPRESS_DB_HOST: wordpress_db:3306
      WORDPRESS_DB_NAME: "{{ db_name | string }}"
      WORDPRESS_DB_USER: "{{ db_user | string }}"
      WORDPRESS_DB_PASSWORD: "{{ db_password | string }}"
    volumes:
      - wordpress_data:/var/www/html