---
- name: Создание пользователя репликации
  ansible.mysql.mysql_user:
    login_unix_socket: "{{ mysql_primary_socket_dir }}/mysqld.sock"
    login_user: root
    login_password: "{{ db_root_password | string }}"
    config_file: ''
    name: replicator
    host: '%'
    plugin: caching_sha2_password
    plugin_auth_string: "{{ db_replication_password | string }}"
    salt: wordpress-repl-salt1
    priv: '*.*:REPLICATION SLAVE'
    state: present
  no_log: true

- name: Создание каталога для дампа
  ansible.builtin.file:
    path: /var/backups/wordpress
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Остановка WordPress на время переноса данных
  community.docker.docker_container:
    name: wordpress
    state: stopped
    stop_timeout: 60

- name: Сохранение базы WordPress перед переносом
  ansible.mysql.mysql_db:
    name: "{{ db_name }}"
    state: dump
    target: /var/backups/wordpress/initial.sql
    single_transaction: true
    quick: true
    hex_blob: true
    dump_extra_args: --set-gtid-purged=OFF --routines --events --triggers --databases
  when: not replay_pending.stat.exists
  no_log: true

- name: Ограничение доступа к дампу
  ansible.builtin.file:
    path: /var/backups/wordpress/initial.sql
    owner: root
    group: root
    mode: '0600'

- name: Отметка начала переноса
  ansible.builtin.copy:
    dest: /var/backups/wordpress/replay.pending
    content: "Перенос не завершён. Сохранённый дамп нельзя перезаписывать.\n"
    owner: root
    group: root
    mode: '0600'

- name: Остановка репликации перед повторной попыткой переноса
  ansible.mysql.mysql_replication:
    mode: stopreplica
  when: replica_before.Is_Replica | default(false)
  no_log: true

- name: Получение позиции журнала перед восстановлением дампа
  ansible.mysql.mysql_replication:
    login_unix_socket: "{{ mysql_primary_socket_dir }}/mysqld.sock"
    mode: getprimary
  register: replay_position
  changed_when: false
  no_log: true

- name: Подключение реплики с позиции перед восстановлением
  ansible.mysql.mysql_replication:
    mode: changeprimary
    primary_host: wordpress_db
    primary_port: 3306
    primary_user: replicator
    primary_password: "{{ db_replication_password | string }}"
    primary_log_file: "{{ replay_position.File }}"
    primary_log_pos: "{{ replay_position.Position | int }}"
  no_log: true

- name: Разрешение получения ключа для передачи пароля
  ansible.mysql.mysql_query:
    query: CHANGE REPLICATION SOURCE TO GET_SOURCE_PUBLIC_KEY=1;
  no_log: true

- name: Запуск репликации перед восстановлением дампа
  ansible.mysql.mysql_replication:
    mode: startreplica
  no_log: true

- name: Восстановление дампа на основной БД с записью изменений в журнал
  ansible.mysql.mysql_db:
    name: all
    state: import
    target: /var/backups/wordpress/initial.sql
    sql_log_bin: true
  no_log: true

- name: Проверка получения данных репликой
  ansible.builtin.include_tasks: mysql_replication_check.yml

- name: Удаление отметки незавершённого переноса
  ansible.builtin.file:
    path: /var/backups/wordpress/replay.pending
    state: absent

- name: Запуск WordPress после успешного переноса
  community.docker.docker_container:
    name: wordpress
    state: started
