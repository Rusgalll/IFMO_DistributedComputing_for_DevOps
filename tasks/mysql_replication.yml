---
- name: Управление репликацией MySQL
  module_defaults:
    ansible.mysql.mysql_replication:
      login_unix_socket: "{{ mysql_replica_socket_dir }}/mysqld.sock"
      login_user: root
      login_password: "{{ db_root_password | string }}"
      config_file: ''
      fail_on_error: true
    ansible.mysql.mysql_query:
      login_unix_socket: "{{ mysql_replica_socket_dir }}/mysqld.sock"
      login_user: root
      login_password: "{{ db_root_password | string }}"
      config_file: ''
    ansible.mysql.mysql_db:
      login_unix_socket: "{{ mysql_primary_socket_dir }}/mysqld.sock"
      login_user: root
      login_password: "{{ db_root_password | string }}"
      config_file: ''
  block:
    - name: Получение текущих настроек реплики
      ansible.mysql.mysql_replication:
        mode: getreplica
      register: replica_before
      changed_when: false
      no_log: true

    - name: Проверка незавершённого переноса
      ansible.builtin.stat:
        path: /var/backups/wordpress/replay.pending
      register: replay_pending

    - name: Первоначальный перенос данных через журнал основной БД
      ansible.builtin.include_tasks: mysql_replication_init.yml
      when: >-
        (mysql_resync | default(false) | bool) or
        not (replica_before.Is_Replica | default(false)) or
        replay_pending.stat.exists

    - name: Запуск репликации
      ansible.mysql.mysql_replication:
        mode: startreplica
      no_log: true

    - name: Проверка синхронизации
      ansible.builtin.include_tasks: mysql_replication_check.yml

- name: Результат проверки репликации
  ansible.builtin.debug:
    msg: Реплика подключена и применила изменения основной БД.
