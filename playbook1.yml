---
- name: Установка Docker и запуск WordPress
  hosts: carrier
  become: true

  vars:
    wordpress_port: 8080
    db_name: wordpress
    db_user: wordpress
    db_password: example
    db_root_password: example

  tasks:
    - name: Подготовка Docker
      ansible.builtin.import_tasks: tasks/docker.yml

    - name: Подготовка MySQL
      ansible.builtin.import_tasks: tasks/mysql.yml

    - name: Подготовка WordPress
      ansible.builtin.import_tasks: tasks/wordpress.yml
